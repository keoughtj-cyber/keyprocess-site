<text x="90" y="128.5" font-size="13" font-weight="600" fill="#14213d">Building or improving something?</text>
<rect x="361" y="113" width="59" height="22" rx="11" fill="#dcf3ea"/>
<text x="390.5" y="128" font-size="11.5" font-weight="700" fill="#12805c" text-anchor="middle">Check</text>
<rect x="48" y="150" width="384" height="40" rx="10" fill="#f4f7fb"/>
<circle cx="70" cy="170" r="10" fill="#dcf3ea"/>
<path d="M65 170l3.5 3.5 6.5-7" stroke="#12805c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="174.5" font-size="13" font-weight="600" fill="#14213d">Relies on computer science?</text>
<rect x="361" y="159" width="59" height="22" rx="11" fill="#dcf3ea"/>
<text x="390.5" y="174" font-size="11.5" font-weight="700" fill="#12805c" text-anchor="middle">Check</text>
<rect x="48" y="196" width="384" height="40" rx="10" fill="#f4f7fb"/>
<circle cx="70" cy="216" r="10" fill="#fdf1d6"/>
<path d="M70 210v7M70 221v.5" stroke="#9a6400" stroke-width="2.5" stroke-linecap="round"/>
<text x="90" y="220.5" font-size="13" font-weight="600" fill="#14213d">Unsure how at the start?</text>
<rect x="375" y="205" width="45" height="22" rx="11" fill="#fdf1d6"/>
<text x="397.5" y="220" font-size="11.5" font-weight="700" fill="#9a6400" text-anchor="middle">Ask</text>
<rect x="48" y="242" width="384" height="40" rx="10" fill="#f4f7fb"/>
