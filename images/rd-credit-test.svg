<path d="M70 256v7M70 267v.5" stroke="#9a6400" stroke-width="2.5" stroke-linecap="round"/>
<text x="90" y="266.5" font-size="13" font-weight="600" fill="#14213d">Tested different approaches?</text>
<rect x="375" y="251" width="45" height="22" rx="11" fill="#fdf1d6"/>
<text x="397.5" y="266" font-size="11.5" font-weight="700" fill="#9a6400" text-anchor="middle">Ask</text>
</g></svg>
