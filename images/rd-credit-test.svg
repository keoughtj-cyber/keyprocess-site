<rect x="24" y="24" width="432" height="272" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<text x="48" y="62" font-size="15" font-weight="700" fill="#14213d">R&amp;D tax credit: the four-part test</text>
<text x="48" y="82" font-size="11.5" fill="#4a5568">Every question must be a yes</text>
<rect x="315.2" y="44" width="116.80000000000001" height="30" rx="15" fill="#fff6e0" stroke="#f4b740"/>
<text x="373.6" y="64" font-size="12" font-weight="700" fill="#9a6400" text-anchor="middle">Ask your CPA</text>
<rect x="48" y="104" width="384" height="40" rx="10" fill="#f4f7fb"/>
<circle cx="70" cy="124" r="10" fill="#dcf3ea"/>
