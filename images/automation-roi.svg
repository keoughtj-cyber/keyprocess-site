<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Illustration of where automation ROI comes from, using a real result: lease paperwork cut from 1.5 to 2 hours to 5 to 10 minutes, across 300 to 400 leases a year, saving about 55 workdays">
<rect width="480" height="320" rx="22" fill="#0f1a33"/>
<rect x="24" y="24" width="432" height="272" rx="16" fill="#fff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<text x="48" y="62" font-size="15" font-weight="700" fill="#14213d">Where automation ROI comes from</text>
<text x="48" y="82" font-size="11.5" fill="#4a5568">Real result: lease approval paperwork</text>
<rect x="322.6" y="44" width="109.4" height="30" rx="15" fill="#fff6e0" stroke="#f4b740"/>
<text x="377.3" y="64" font-size="12" font-weight="700" fill="#9a6400" text-anchor="middle">Real result</text>
<rect x="48" y="104" width="384" height="40" rx="10" fill="#f4f7fb"/>
<circle cx="70" cy="124" r="10" fill="#fdf1d6"/>
<path d="M70 118v7M70 129v.5" stroke="#9a6400" stroke-width="2.5" stroke-linecap="round"/>
<text x="90" y="128.5" font-size="13" font-weight="600" fill="#14213d">Paperwork per lease, before</text>
<rect x="333" y="113" width="87" height="22" rx="11" fill="#fdf1d6"/>
<text x="376.5" y="128" font-size="11.5" font-weight="700" fill="#9a6400" text-anchor="middle">1.5-2 hrs</text>
<rect x="48" y="150" width="384" height="40" rx="10" fill="#f4f7fb"/>
<circle cx="70" cy="170" r="10" fill="#dcf3ea"/>
<path d="M65 170l3.5 3.5 6.5-7" stroke="#12805c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="174.5" font-size="13" font-weight="600" fill="#14213d">Paperwork per lease, after</text>
<rect x="340" y="159" width="80" height="22" rx="11" fill="#dcf3ea"/>
<text x="380.0" y="174" font-size="11.5" font-weight="700" fill="#12805c" text-anchor="middle">5-10 min</text>
<rect x="48" y="196" width="384" height="40" rx="10" fill="#f4f7fb"/>
<circle cx="70" cy="216" r="10" fill="#e9eef6"/>
<path d="M65 216l3.5 3.5 6.5-7" stroke="#1f3a68" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="220.5" font-size="13" font-weight="600" fill="#14213d">Leases handled a year</text>
<rect x="347" y="205" width="73" height="22" rx="11" fill="#e9eef6"/>
<text x="383.5" y="220" font-size="11.5" font-weight="700" fill="#1f3a68" text-anchor="middle">300-400</text>
<rect x="48" y="242" width="384" height="40" rx="10" fill="#f4f7fb"/>
<circle cx="70" cy="262" r="10" fill="#dcf3ea"/>
<path d="M65 262l3.5 3.5 6.5-7" stroke="#12805c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="266.5" font-size="13" font-weight="600" fill="#14213d">Staff time saved a year</text>
<rect x="340" y="251" width="80" height="22" rx="11" fill="#dcf3ea"/>
<text x="380.0" y="266" font-size="11.5" font-weight="700" fill="#12805c" text-anchor="middle">~55 days</text>
</g></svg>
