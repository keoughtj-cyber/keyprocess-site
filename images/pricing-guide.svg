<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Illustration of the three ways to buy automation: a single process from $1,000, a package from $3,000, and Automation Care from $500 a month">
<rect width="480" height="320" rx="22" fill="#0f1a33"/>
<rect x="24" y="24" width="432" height="272" rx="16" fill="#fff"/>
