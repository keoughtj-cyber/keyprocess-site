<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Illustration of busywork flowing into one automation and out as finished tasks">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fe0"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" rx="22" fill="#f4f7fb"/>
  <g fill="none" stroke="#1d6fe0" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round" opacity=".6">
    <path d="M164 70 C 220 70, 224 180, 280 180"/>
    <path d="M164 180 L 280 180"/>
    <path d="M164 290 C 220 290, 224 180, 280 180"/>
  </g>
  <g fill="none" stroke="#12805c" stroke-width="2.5" stroke-linecap="round" opacity=".7">
    <path d="M280 180 C 336 180, 334 70, 380 70"/>
    <path d="M280 180 L 380 180"/>
    <path d="M280 180 C 336 180, 334 290, 380 290"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#14213d">
    <!-- inputs -->
    <g transform="translate(22 48)">
      <rect width="142" height="44" rx="12" fill="#fff" stroke="#dfe5ee"/>
      <rect x="12" y="13" width="22" height="18" rx="3" fill="none" stroke="#e35d5d" stroke-width="2"/><path d="M12 15l11 8 11-8" fill="none" stroke="#e35d5d" stroke-width="2"/>
      <text x="44" y="27">Approvals</text>
    </g>
    <g transform="translate(22 158)">
      <rect width="142" height="44" rx="12" fill="#fff" stroke="#dfe5ee"/>
      <rect x="13" y="11" width="20" height="22" rx="3" fill="none" stroke="#e35d5d" stroke-width="2"/><path d="M17 18h12M17 23h12M17 28h8" stroke="#e35d5d" stroke-width="2"/>
      <text x="44" y="27">Requests</text>
    </g>
    <g transform="translate(22 268)">
      <rect width="142" height="44" rx="12" fill="#fff" stroke="#dfe5ee"/>
      <rect x="12" y="12" width="22" height="20" rx="3" fill="none" stroke="#e35d5d" stroke-width="2"/><path d="M12 19h22M19 12v20" stroke="#e35d5d" stroke-width="2"/>
      <text x="44" y="27">New leads</text>
    </g>
    <!-- core -->
    <circle cx="280" cy="180" r="62" fill="url(#core)"/>
    <circle cx="280" cy="180" r="76" fill="none" stroke="#1d6fe0" stroke-opacity=".25" stroke-width="2"/>
    <path d="M266 160l-12 22h18l-8 22 26-30h-18l10-14z" fill="#f4b740" transform="translate(8 -2)"/>
