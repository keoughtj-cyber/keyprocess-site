      <circle cx="23" cy="22" r="11" fill="#dcf3ea"/><path d="M18 22l4 4 6-7" stroke="#12805c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="42" y="27">Contracts sent</text>
    </g>
    <g transform="translate(380 158)">
      <rect width="158" height="44" rx="12" fill="#fff" stroke="#dfe5ee"/>
      <circle cx="23" cy="22" r="11" fill="#dcf3ea"/><path d="M18 22l4 4 6-7" stroke="#12805c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="42" y="27">Follow-ups sent</text>
    </g>
    <g transform="translate(380 268)">
      <rect width="158" height="44" rx="12" fill="#fff" stroke="#dfe5ee"/>
      <circle cx="23" cy="22" r="11" fill="#dcf3ea"/><path d="M18 22l4 4 6-7" stroke="#12805c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="42" y="27">Posts live</text>
