  <rect width="320" height="180" rx="16" fill="#e8f1fd"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">
    <rect x="28" y="30" width="170" height="48" rx="14" fill="#fff"/>
