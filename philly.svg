<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Illustration of Philadelphia rowhomes connected by automation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6fe0"/>
      <stop offset="1" stop-color="#0f1a33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b740" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f4b740"/>
      <stop offset="1" stop-color="#f4b740" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="560" height="380" rx="22" fill="url(#sky)"/>
  <g fill="#ffffff" opacity=".12">
    <circle cx="70" cy="60" r="2"/><circle cx="150" cy="40" r="1.5"/><circle cx="420" cy="50" r="2"/><circle cx="500" cy="90" r="1.5"/><circle cx="300" cy="30" r="1.5"/>
  </g>
  <!-- skyline -->
  <g fill="#ffffff" opacity=".10">
    <rect x="60" y="120" width="34" height="140"/><rect x="100" y="90" width="26" height="170"/>
    <rect x="200" y="70" width="30" height="190"/><polygon points="200,70 215,40 230,70"/>
    <rect x="236" y="105" width="40" height="155"/>
    <rect x="330" y="60" width="30" height="200"/><polygon points="330,60 345,25 360,60"/>
    <rect x="368" y="100" width="36" height="160"/><rect x="430" y="115" width="44" height="145"/>
  </g>
  <!-- City Hall tower -->
  <g fill="#ffffff" opacity=".18">
    <rect x="276" y="80" width="22" height="180"/><rect x="280" y="55" width="14" height="25"/><rect x="285" y="38" width="4" height="17"/>
  </g>
  <!-- data line -->
  <path d="M40 150 C 140 110, 220 190, 300 140 S 460 110, 520 150" fill="none" stroke="url(#glow)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- rowhomes -->
  <g>
    <rect x="40" y="200" width="96" height="140" fill="#b9573f"/>
    <rect x="136" y="190" width="96" height="150" fill="#c8664a"/>
    <rect x="232" y="205" width="96" height="135" fill="#a94e39"/>
    <rect x="328" y="192" width="96" height="148" fill="#c25f45"/>
    <rect x="424" y="202" width="96" height="138" fill="#b55440"/>
    <g fill="#14213d">
      <rect x="36" y="194" width="104" height="10"/><rect x="132" y="184" width="104" height="10"/><rect x="228" y="199" width="104" height="10"/><rect x="324" y="186" width="104" height="10"/><rect x="420" y="196" width="104" height="10"/>
    </g>
    <!-- windows -->
    <g fill="#fdf3d6">
      <rect x="56" y="220" width="24" height="32" rx="2"/><rect x="96" y="220" width="24" height="32" rx="2"/>
      <rect x="152" y="212" width="24" height="32" rx="2"/><rect x="192" y="212" width="24" height="32" rx="2"/>
      <rect x="248" y="225" width="24" height="32" rx="2"/><rect x="288" y="225" width="24" height="32" rx="2"/>
      <rect x="344" y="212" width="24" height="32" rx="2"/><rect x="384" y="212" width="24" height="32" rx="2"/>
      <rect x="440" y="222" width="24" height="32" rx="2"/><rect x="480" y="222" width="24" height="32" rx="2"/>
    </g>
    <g fill="#f4b740">
      <rect x="56" y="272" width="24" height="24" rx="2"/><rect x="192" y="266" width="24" height="24" rx="2"/><rect x="344" y="266" width="24" height="24" rx="2"/><rect x="480" y="274" width="24" height="24" rx="2"/>
    </g>
    <!-- doors -->
    <g fill="#14213d">
      <rect x="98" y="290" width="22" height="50" rx="2"/><rect x="152" y="284" width="22" height="56" rx="2"/><rect x="290" y="292" width="22" height="48" rx="2"/><rect x="386" y="286" width="22" height="54" rx="2"/><rect x="440" y="290" width="22" height="50" rx="2"/>
    </g>
    <rect x="232" y="268" width="40" height="22" rx="2" fill="#fdf3d6"/>
    <rect x="20" y="340" width="520" height="20" fill="#0b1326"/>
  </g>
  <!-- status pins -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">
    <g transform="translate(64 150)">
      <rect width="118" height="30" rx="15" fill="#ffffff"/>
      <circle cx="16" cy="15" r="8" fill="#dcf3ea"/><path d="M12 15l3 3 5-6" stroke="#12805c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="30" y="19" fill="#14213d">License OK</text>
    </g>
    <g transform="translate(220 120)">
      <rect width="128" height="30" rx="15" fill="#ffffff"/>
      <circle cx="16" cy="15" r="8" fill="#dcf3ea"/><path d="M12 15l3 3 5-6" stroke="#12805c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="30" y="19" fill="#14213d">Lease drafted</text>
    </g>
    <g transform="translate(380 146)">
      <rect width="136" height="30" rx="15" fill="#f4b740"/>
      <circle cx="16" cy="15" r="8" fill="#14213d"/><text x="12.5" y="19" fill="#f4b740">!</text>
      <text x="30" y="19" fill="#14213d">Price drop live</text>
    </g>
  </g>
</svg>
